name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.4)'
        required: true
        default: 'v1.3.4'

# Required permissions for creating releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RecordFlow ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## RecordFlow v1.3.4 — Frame-Accurate Smooth Export Animations & Smart Fullscreen Area-Picker Toolbar

            ### Download
            Download the `.exe` or `.msi` installer for Windows below. 100% free, open-source, no watermarks, and zero cloud uploads.

            ### What's New in v1.3.4
            - **Fixed Choppy / Missing Animations in Exported Videos**:
              - Replaced offscreen high-speed `<video>` playback in the local export engine with a lightweight ISO-BMFF MP4 demuxer + hardware-accelerated WebCodecs `VideoDecoder` pipeline (`Mp4VideoFrameStream`) that decodes every source frame sequentially in exact presentation order — eliminating frozen frames, skipped CSS/UI animations, and cursor/video desync.
              - Added a deterministic paused-seek DOM-attached fallback for WebM and non-WebCodecs clips, switched WebCodecs `VideoEncoder` to `latencyMode: "quality"` (preventing encoder frame drops), removed `desynchronized` canvas buffer tearing, and enabled high-quality image smoothing for crisp motion & zooms.
              - Kept Edit Studio preview video decoders in the compositor layer for smoother 60fps preview playback.
            - **Fixed Area-Selection "Start recording" Toolbar Overlap on Full-Screen Drags**:
              - Added a viewport-aware 3-tier collision-free toolbar layout (`below → above → inside-bottom`) with live `ResizeObserver` measurement and horizontal viewport clamping so the **Start recording** action bar automatically adjusts itself and stays 100% visible and clickable even when selecting the full screen or dragging near screen edges.
              - Automatically hides the top guidance pill once a selection toolbar is active (and makes it non-blocking while dragging) so nothing ever overrides or covers the **Start recording** controls.
              - Anchored the inline preview stage area action pill cleanly inside the preview bounds.
            - **Includes all v1.3.3 highlights**:
              - Direct `PrintWindow` selected-window live previews, conflict-free `Ctrl+Alt+Shift+R/P` global shortcuts, fullscreen viewport scrolling, and official brand header.

            ### System Requirements
            - Windows 10 version 1903 (build 18362) or later (x64)
          releaseDraft: false
          prerelease: false
