name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.5)'
        required: true
        default: 'v1.3.5'

# Required permissions for creating releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RecordFlow ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## RecordFlow v1.3.5 — Draggable Invisible Floating Recording Controls

            ### Download
            Download the `.exe` or `.msi` installer for Windows below. 100% free, open-source, no watermarks, and zero cloud uploads.

            ### What's New in v1.3.5
            - **Draggable, Capture-Excluded Floating Recording Control Pill**:
              - Automatically spawns a compact, always-on-top mini control bar (live elapsed timer, **Pause/Resume**, and **Stop**) in the corner whenever a recording starts—so you can pause or stop directly from any screen without switching back to the RecordFlow window.
              - **100% Invisible in Recordings**: Protected with Windows `WDA_EXCLUDEFROMCAPTURE` (`setContentProtected(true)`), so it never appears in your captured video.
              - **Freely Draggable with Position Memory**: Drag it anywhere across your display(s) via the grip handle or timer area; RecordFlow automatically remembers your preferred spot for future recordings and restores the main window straight into Edit Studio when stopped.
            - **Includes all v1.3.4 highlights**:
              - Frame-accurate WebCodecs `VideoDecoder` + ISO-BMFF MP4 demuxing and `latencyMode: "quality"` export for silky-smooth UI animations and cursor/zoom sync.
              - Smart viewport-clamped **Start recording** toolbar positioning on full-screen and edge-hugging area drags.

            ### System Requirements
            - Windows 10 version 1903 (build 18362) or later (x64)
          releaseDraft: false
          prerelease: false
