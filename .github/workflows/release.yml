name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        default: 'v1.3.0'

# Required permissions for creating releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RecordFlow ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## RecordFlow v1.3.0 — Warm Studio Palette, Resilient Save Paths & Interactive Area Capture

            ### Download
            Download the `.exe` or `.msi` installer for Windows below. 100% free, open-source, no watermarks, and zero cloud uploads.

            ### What's New in v1.3.0
            - **Bulletproof Recordings Directory Resolution (`os error 2` Fix)**:
              - Automatically verifies write access and falls back across `Videos\RecordFlow\Recordings`, `Documents\RecordFlow\Recordings`, `OneDrive`, user profile root (`C:\Users\<user>\RecordFlow\Recordings`), and `%LOCALAPPDATA%` when Windows `Documents` is a broken OneDrive junction.
              - Added an interactive **Save Folder** control in the Record workspace bottom bar to open the recordings folder in Explorer or choose any custom destination folder.
            - **Interactive Area Selection & Immediate Recording**:
              - Clicking **Area** or **Select area** now opens a clean, fresh selection overlay without any pre-decided region.
              - Drag anywhere on screen (or directly on the live preview stage) to draw your capture area, then click **Record this area (Enter)** to start recording immediately or **Apply area** to lock it into the preview.
            - **Warm Studio Color Architecture**:
              - Redesigned all 8 themes (**Obsidian Flame**, **Molten Ember**, **Crimson Noir**, **Burnished Copper**, **Velvet Rosé**, **Royal Amethyst**, **Editorial Ivory**, and **Alabaster Sun**) and all 18 studio canvas backgrounds with warm coral, amber, gold, crimson, rose, terracotta, and obsidian palettes.
            - **Enhanced Record & Edit Studio UX**:
              - Inline **Resolution** (`1080p HD`, `720p Fast`, `Native`), **Frame Rate** (`60 fps`, `30 fps`), and **Cursor Capture** selectors in the Record header.
              - **Quick record** button alongside **Start recording**, inline **Microphone gain** slider, **Camera horizontal mirror** toggle, live recording timer/stop pill in the TopBar, and inline project renaming on the Edit Studio stage.

            ### System Requirements
            - Windows 10 version 1903 (build 18362) or later (x64)
          releaseDraft: false
          prerelease: false
