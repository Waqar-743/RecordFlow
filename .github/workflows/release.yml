name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.3)'
        required: true
        default: 'v1.3.3'

# Required permissions for creating releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RecordFlow ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## RecordFlow v1.3.3 — Live Window Previews, Fullscreen Layout Fix, Conflict-Free Hotkeys & Official Brand Header

            ### Download
            Download the `.exe` or `.msi` installer for Windows below. 100% free, open-source, no watermarks, and zero cloud uploads.

            ### What's New in v1.3.3
            - **Fixed Selected Window Live Preview**:
              - Replaced desktop-crop thumbnails with direct per-window capture via `PrintWindow(PW_RENDERFULLCONTENT)` (cropping invisible DWM drop-shadow borders) so selecting any window updates the right preview container with that window's actual content even when covered by RecordFlow.
              - Added immediate on-demand preview refresh when selecting a window, removed the 8-window thumbnail limit, added a refresh button on the window preview stage, and prevented stale settings overwrites during async mode changes.
            - **Fixed Fullscreen / Maximized Viewport Layout & Scrolling**:
              - Lowered minimum window dimensions (`900×560`) and fixed flex `min-h-0` / responsive stage heights so the bottom controls and **Start recording** action bar stay fully visible and scrollable on all screen resolutions and DPI scales.
            - **Fixed `Alt+Shift+R` Global Shortcut Conflict**:
              - Switched default global hotkeys to conflict-free `Ctrl+Alt+Shift+R` (Start/Stop) and `Ctrl+Alt+Shift+P` (Pause/Resume).
              - Added automatic conflict-free startup fallback when an existing saved hotkey is already taken by another app, clean human-readable conflict messages, and hotkey cleanup on app exit.
            - **Official RecordFlow Brand Icon in Top-Left Header**:
              - Replaced the placeholder header icon with the official RecordFlow logo (`/recordflow.png`).
            - **Includes all v1.3.2 highlights**:
              - 15x–25x faster local export with linear hardware decoding and offscreen backdrop/shadow caching, plus **Instant save original**.
              - Graceful Windows Graphics Capture fallback for `BorderConfigUnsupported` & cursor settings.
              - Bulletproof recordings folder resolution with interactive folder selector, interactive area selection, and the 8 warm studio themes.

            ### System Requirements
            - Windows 10 version 1903 (build 18362) or later (x64)
          releaseDraft: false
          prerelease: false
