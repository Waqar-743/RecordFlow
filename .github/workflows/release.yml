name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.0)'
        required: true
        default: 'v1.2.0'

# Required permissions for creating releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RecordFlow ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## RecordFlow v1.2.0 — Complete Studio Redesign & Post-Recording Editor

            ### Download
            Download the `.exe` or `.msi` installer for Windows below. 100% free, open-source, no watermarks, and zero cloud uploads.

            ### What's New in v1.2.0
            - **Ground-Up Studio Redesign & Maximized Launch**: Opens maximized into a clutter-free desktop studio shell with a streamlined top navigation bar (`Record` / `Edit` workspace switcher, `Open project`, `Save project`, `Theme Selector`, `Script` panel toggle, and `Shortcuts`) plus a dismissible alert banner for hotkey conflict notices.
            - **8 Dynamic Persistent Themes**: Instant system-wide theme switching across **Graphite**, **Ember**, **Paper**, **Daylight**, **Midnight**, **Nord**, **Rosé**, and **Forest** with live swatches and session persistence.
            - **Refined Record Workspace & Screen-Share Picker**:
              - **Screen**, **Area** (auto-minimizes app into a full-screen translucent region selector with live dimensions & `Esc` restore), and **Window** (live active window enumeration, search, thumbnails, and `"Only this window is recorded"` preview) capture modes.
              - Structured **Microphone** (live VU meter + device picker), **Camera** (independent synchronized track + mini preview), and **Countdown** (`Off / 3s / 5s`) control cards, **Hide app while recording**, and a **Screen-Share Source Picker** modal with **Share with system audio**.
            - **Independent Synchronized Camera Track & 60 Hz Cursor Tracking**:
              - Captures webcam into a synchronized companion stream (`.cam.mp4`) and logs cursor positions & clicks (`.cursor.json`) at 60 Hz so everything remains non-destructively editable after recording.
            - **Post-Recording Edit Studio**:
              - Automatic transition into the **Edit** workspace with a 6-tab Inspector (**Canvas**, **Zoom**, **Cursor**, **Audio**, **Camera**, **Blur**).
              - **Canvas & Backgrounds**: `16:9`, `9:16`, `1:1`, `4:5`, and `Original` aspect ratios, `Fit` vs `Fill` framing, padding, corner radius, drop shadow, 18 curated backgrounds, and Custom Image upload.
              - **Non-Destructive Camera Overlay**: Reposition webcam after recording via quick-snap presets or direct drag-and-drop on the canvas, adjust size, shape (`Circle`, `Rounded`, `Square`), mirror, border, shadow, or toggle visibility on/off.
              - **Interactive Timeline & Playback Bar**: Play/Pause, timecode, draggable & editable Trim Start/End handles, zoom intensity presets (`Subtle`, `Balanced`, `Close`), auto-zoom from clicks, audio waveform track, and bottom-right **Export**.
            - **Local 4K MP4 & WebM Export Modal**:
              - Renders locally on your machine (`MP4` or `WebM`, `4K / 1440p / 1080p / 720p`, `60 / 30 fps`, `Best / High / Small` quality) with real-time progress.

            ### System Requirements
            - Windows 10 version 1903 (build 18362) or later (x64)
          releaseDraft: false
          prerelease: false
